services:
  - type: worker
    name: apple-store-pickup-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor_daemon.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PICKUP_INTERVAL
        value: "120"
